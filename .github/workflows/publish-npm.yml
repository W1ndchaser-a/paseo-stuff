# Publishes a plugin to npm when its GitHub release is published.
# Authentication uses npm trusted publishing (OIDC): no npm token or OTP.
# npm trust needs an existing package, so the repository owner publishes a new
# package's first version manually. The package then trusts this workflow once:
#   npm trust github <package> --file publish-npm.yml --repo geoqiao/paseo-stuff --allow-publish
# Later versions are published only by this workflow.
name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. math-renderer-v0.1.0-beta.6
        required: true
permissions:
  contents: read
concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.tag }}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Resolve plugin
        id: plugin
        run: |
          # Only plugins published to npm are listed here.
          case "$TAG" in
            deepseek-harness-v*) dir=deepseek-harness; version="${TAG#deepseek-harness-v}" ;;
            math-renderer-v*) dir=math-renderer; version="${TAG#math-renderer-v}" ;;
            readable-agent-activity-v*) dir=agent-activity; version="${TAG#readable-agent-activity-v}" ;;
            *) echo "::notice::$TAG is not an npm-published plugin; skipping."; exit 0 ;;
          esac
          echo "dir=plugins/$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.plugin.outputs.dir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - if: steps.plugin.outputs.dir
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.plugin.outputs.dir
        name: Check package version
        id: check
        working-directory: ${{ steps.plugin.outputs.dir }}
        env:
          VERSION: ${{ steps.plugin.outputs.version }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@11
          name=$(node -p 'require("./package.json").name')
          actual=$(node -p 'require("./package.json").version')
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::$TAG does not match package.json version $actual"; exit 1
          fi
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$name@$VERSION is already on npm; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish
        working-directory: ${{ steps.plugin.outputs.dir }}
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm run prepare:markdown --if-present
          npm run prepare:wasm --if-present
      - if: steps.check.outputs.publish
        working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm run check
      - if: steps.check.outputs.publish
        working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm publish --tag latest
